<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Planificador de Viajes</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(140deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px 40px;
      width: 440px;
      max-width: 100%;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      font-size: 52px;
      line-height: 1;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-top: 14px;
    }

    .brand p {
      font-size: 14px;
      color: #6B7280;
      margin-top: 5px;
    }

    .divider {
      height: 1px;
      background: #F3F4F6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #111827;
      background: #FAFAFA;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #1CAC78;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(28, 172, 120, 0.12);
    }

    input::placeholder { color: #9CA3AF; }

    .btn {
      width: 100%;
      background: #1CAC78;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(28, 172, 120, 0.35);
    }

    .btn:hover {
      background: #17a068;
      box-shadow: 0 6px 20px rgba(28, 172, 120, 0.45);
    }

    .btn:active { transform: scale(0.98); }

    .error-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #DC2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Loading overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 32, 39, 0.88);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .overlay.active { display: flex; }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #1CAC78;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay-title {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
    }

    .overlay-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">✈️</div>
      <h1>Planificador de Viajes</h1>
      <p>Dinos dónde quieres ir y organizamos tu viaje</p>
    </div>

    <div class="divider"></div>

    {% if error %}
    <div class="error-box">⚠ {{ error }}</div>
    {% endif %}

    <form action="/planificar" method="POST" onsubmit="showLoading(event)">
      <div class="form-group">
        <label for="lugar">Destino</label>
        <input type="text" id="lugar" name="lugar" placeholder="ej. Roma, Japón, Marrakech…" autocomplete="off" autofocus>
      </div>
      <div class="form-group">
        <label for="dias">Número de días</label>
        <input type="number" id="dias" name="dias" placeholder="ej. 5" min="1" max="30">
      </div>
      <button type="submit" class="btn">
        Planificar mi viaje <span>→</span>
      </button>
    </form>
  </div>

  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <div class="overlay-title">Creando tu planificación…</div>
    <div class="overlay-sub">Buscando los mejores sitios y restaurantes</div>
  </div>

  <script>
    function showLoading(e) {
      const lugar = document.getElementById('lugar').value.trim();
      const dias  = document.getElementById('dias').value.trim();
      if (lugar && dias) {
        document.getElementById('overlay').classList.add('active');
      }
    }
  </script>

</body>
</html>
